name: Release

"on":
  push:
    branches: [main]
    tags: ["v*"]
    # A deliberate request-file change can initiate a release without dispatch.
    # GitHub does not apply path filters to tag pushes.
    paths: [.github/release-request.json]
  workflow_dispatch:
    inputs:
      mode:
        description: Version to release (current for the first release)
        required: true
        default: current
        type: choice
        options: [current, patch, minor, major, custom, existing-tag]
      version:
        description: X.Y.Z version, only when mode is custom
        required: false
        type: string
      tag:
        description: Existing vX.Y.Z tag to resume (existing-tag mode)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zscan-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'LIghtJUNction/zscan' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      toolchain: ${{ steps.prepare.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Prepare or resume an immutable release tag
        id: prepare
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CUSTOM_VERSION: ${{ inputs.version }}
          RELEASE_EXISTING_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_release.py

  resolve:
    if: github.repository == 'LIghtJUNction/zscan' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      toolchain: ${{ steps.tag.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve and validate an existing tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py resolve

  verify:
    needs: [prepare, resolve]
    if: >-
      ${{ always() && !cancelled() &&
          ((needs.prepare.result == 'success' && needs.resolve.result == 'skipped') ||
           (needs.resolve.result == 'success' && needs.prepare.result == 'skipped')) }}
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.prepare.outputs.commit || needs.resolve.outputs.commit }}

  publish:
    needs: [prepare, resolve, verify]
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit || needs.resolve.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version || needs.resolve.outputs.version }}
      # Keep package bytes reproducible when replaying an existing release tag.
      # Regular CI deliberately continues to track rolling stable.
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.toolchain || needs.resolve.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit || needs.resolve.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Recheck identity and package the checked commit
        run: |
          python3 scripts/release.py check
          python3 scripts/audit.py
          mkdir -p target
          cargo package --list --locked > target/package-files.txt
          python3 scripts/audit.py --package-list target/package-files.txt
          cat target/package-files.txt
          cargo package --locked
          cargo publish --dry-run --locked
      - name: Publish once and confirm the registry checksum
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release.py publish
      - name: Create GitHub Release after registry confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py github

