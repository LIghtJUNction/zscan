name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to check for a release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        rust: [stable, 1.70.0]
    steps:
      # actions/checkout v7.0.1; official tag resolved on 2026-11-09.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Check dependency and package contract
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: python3 scripts/audit.py
      - name: Debug, release, and documentation tests
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          cargo test --locked
          cargo test --release --locked
          cargo test --doc --locked
      - name: Check native code generation
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
          RUSTFLAGS: -C target-cpu=native
        run: cargo test --release --locked

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting and Clippy
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable fmt --manifest-path comparison/Cargo.toml --all -- --check
          cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Package contents and dry run
        run: |
          mkdir -p target
          cargo +stable package --list --locked > target/package-files.txt
          python3 scripts/audit.py --package-list target/package-files.txt
          cat target/package-files.txt
          cargo +stable package --locked
          cargo +stable publish --dry-run --locked

  no-std:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Install bare-metal targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable thumbv7em-none-eabi aarch64-unknown-none
      - name: Compile using only core
        run: |
          cargo +stable build --lib --release --locked --target thumbv7em-none-eabi
          cargo +stable build --lib --release --locked --target aarch64-unknown-none

  scalar-miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - name: Interpret scalar paths
        env:
          RUSTFLAGS: --cfg zscan_scalar
        run: cargo +nightly miri test --locked --lib --tests

  backends:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Force scalar, supported SIMD, and filter ablations
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/test_backends.py

  benchmark-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        codegen: [generic, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Smoke benchmark (observations, never a speed gate)
        env:
          RUSTUP_TOOLCHAIN: stable
          RUSTFLAGS: ${{ matrix.codegen == 'native' && '-C target-cpu=native' || '' }}
        run: |
          rustc -vV > benchmark-environment.txt
          git rev-parse HEAD >> benchmark-environment.txt
          python3 -c 'import os; print("RUSTFLAGS=" + os.environ.get("RUSTFLAGS", ""))' >> benchmark-environment.txt
          uname -a >> benchmark-environment.txt
          lscpu >> benchmark-environment.txt
          cargo tree --manifest-path comparison/Cargo.toml --locked >> benchmark-environment.txt
          cargo run --release --manifest-path comparison/Cargo.toml --locked -- --smoke > benchmark-smoke.csv
      # actions/upload-artifact v7.0.2; official tag resolved on 2026-11-09.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-smoke-${{ matrix.os }}-${{ matrix.codegen }}
          path: |
            benchmark-environment.txt
            benchmark-smoke.csv
          if-no-files-found: error

