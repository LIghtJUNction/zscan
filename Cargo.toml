[package]
name = "zscan"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
description = "Zero-dependency, allocation-free byte and substring search for no_std"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zscan"
keywords = ["search", "substring", "memchr", "no-std"]
categories = ["algorithms", "no-std"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[workspace]
members = ["."]
exclude = ["comparison"]
resolver = "3"
